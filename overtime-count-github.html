<!DOCTYPE html>
<html lang="en" data-t="gw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>overtime coUnt by L</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#effaf1;--card:#fff;--ink:#10321c;--mute:#5b7a66;--a:#1faa59;--b:#7be0a0;--on:#fff;--line:#d5e8da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t=yw]{--bg:#fffbea;--ink:#3a2f05;--mute:#8a7a3a;--a:#f5b700;--b:#ffe27a;--on:#3a2f05;--line:#f1e4a8}
[data-t=dr]{--bg:#140c0e;--card:#241418;--ink:#fbe9ea;--mute:#c99aa0;--a:#e5253d;--b:#ff7a89;--on:#fff;--line:#4a2a30}
[data-t=gb]{--bg:#0a0f0b;--card:#121a14;--ink:#e6ffe9;--mute:#8fb99a;--a:#22e06b;--b:#0f7a3a;--on:#06210f;--line:#1f3a27}
[data-t=pp]{--bg:#1a1030;--card:#2a1a4a;--ink:#fff;--mute:#c9b3ee;--a:#c14bff;--b:#ff6fb5;--on:#fff;--line:#44306e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;transition:background .4s}
#app{max-width:520px;margin:0 auto;padding:0 14px 90px}
h1,h2,h3,.bal{font-family:"Baloo 2",system-ui,sans-serif;margin:0}
.top{margin:0 -14px 14px;padding:18px 16px 14px;background:linear-gradient(120deg,var(--a),var(--b),var(--a));background-size:200% 200%;animation:flow 6s ease infinite;color:var(--on);display:flex;gap:10px;align-items:center}
.top .lg{background:#ffffff40;border-radius:12px;width:46px;height:46px;overflow:hidden;flex:none}.top .lg img{width:100%;height:100%;display:block}
.top h1{font-size:24px;line-height:1}.top small{opacity:.85}
@keyframes flow{50%{background-position:100% 50%}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
h2{font-size:20px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mute)}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:3px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--a);outline-offset:1px}
button,.btn{font:700 15px Nunito,system-ui,sans-serif;background:var(--a);color:var(--on);border:0;border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;transition:transform .15s;text-decoration:none;display:inline-block;text-align:center}
button:active,.btn:active{transform:scale(.94)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.full{width:100%;margin-top:8px}
.bal{font-size:40px;color:var(--a);line-height:1}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.bad{color:#e5253d;font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;background:none;color:var(--mute);border-radius:0;font-size:12px;padding:8px 0}
.tabs button span{display:block;font-size:22px}
.tabs .on{color:var(--a)}.tabs .on span{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.35) rotate(-8deg)}}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.av{font-size:26px;background:var(--bg);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--a)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;text-align:center;font-size:13px;width:84px}
.chip button{padding:4px 8px;min-height:32px;font-size:12px;margin-top:4px}
.post img{width:100%;border-radius:10px;margin:8px 0;display:block}
.like{background:none;color:var(--ink);padding:4px 8px;min-height:36px}
.like.y{color:#e5253d}.like.y b{display:inline-block;animation:pop .4s}
.cm{font-size:14px;margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
.stats b{font:800 22px "Baloo 2",sans-serif;display:block;color:var(--a)}
.stats span{font-size:12px;color:var(--mute)}
.big{font-size:64px;text-align:center;display:block;animation:pop 2s infinite}
.th{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;background:var(--bg);color:var(--ink);justify-content:flex-start}
.th.sel{border-color:var(--a)}
.sw{width:34px;height:34px;border-radius:50%}
#cuff{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:20px}
#cuff .bx{background:var(--card);border-radius:20px;padding:22px;text-align:center;max-width:340px;animation:rise .3s}
#cuff .ch{font-size:90px;display:inline-block;animation:shake .5s infinite}
#cuff .cf{font-size:44px;display:block;margin-top:-18px;animation:swing 1s ease-in-out infinite;transform-origin:top}
@keyframes shake{25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
@keyframes swing{50%{transform:rotate(14deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%}
.err{color:#e5253d;min-height:20px;margin:6px 0 0}
.sub{color:var(--mute);margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
var HOSTS=[["https://www.gstatic.com/firebasejs/10.12.2/",".js"],["https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.1/",".min.js"]];
var FILES=["firebase-app-compat","firebase-auth-compat","firebase-firestore-compat"];
var show=function(t,m){var a=document.getElementById("app");if(a)a.innerHTML='<div class="card"><h2>'+t+'</h2><p class="sub">'+String(m).replace(/</g,"&lt;")+'</p></div>'};
window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.innerHTML)show("Something went wrong",e.message)});
function load(src,ok,bad){var x=document.createElement("script");x.src=src;x.onload=ok;x.onerror=bad;document.head.appendChild(x)}
function seq(h,i,done,bad){if(i>=FILES.length)return done();load(h[0]+FILES[i]+h[1],function(){seq(h,i+1,done,bad)},bad)}
function run(){var x=document.createElement("script");x.textContent=document.getElementById("app-js").textContent;document.body.appendChild(x)}
function tryHost(n){
  if(window.firebase&&firebase.auth&&firebase.firestore)return run();
  if(n>=HOSTS.length)return show("Cannot load the online service","Check your internet, turn off any ad blocker or VPN, then refresh the page.");
  seq(HOSTS[n],0,function(){run()},function(){tryHost(n+1)});
}
tryHost(0);
})();
</script>

var em=function(p){var d=String(p).replace(/\D/g,"");return d.length>=6?d+"@overtimecount.app":""};

async function reg(){
  var n=$("#n").value.trim(),pw=$("#pw").value,rc=$("#rc").value.trim().toUpperCase(),e=em($("#ph").value);
  if(!n||!e||pw.length<6)return err("Enter your name, a valid mobile number and a password of 6+ characters.");
  try{
    var cr=await fauth.createUserWithEmailAndPassword(e,pw),uid=cr.user.uid,ref=null;
    if(rc){var q=await db.collection("users").where("code","==",rc).limit(1).get();if(!q.empty&&q.docs[0].id!==uid)ref=q.docs[0].id}
    var code=(n.slice(0,3)+Math.random().toString(36).slice(2,6)).toUpperCase().replace(/[^A-Z0-9]/g,"X");
    await db.collection("pay").doc(uid).set({cfg:JSON.parse(JSON.stringify(DEF)),ents:[]});
    await db.collection("users").doc(uid).set({name:n,code:code,refBy:ref,follows:[],av:rnd(CAST),theme:"gw"});
    if(rc&&!ref)toast("Account created. Referral code was not found.");
  }catch(x){err(ae(x))}
}
async function login(){
  var e=em($("#ph").value),pw=$("#pw").value;
  if(!e||!pw)return err("Enter your mobile number and password.");
  try{await fauth.signInWithEmailAndPassword(e,pw)}catch(x){err(ae(x))}
}

function RS(){var a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;R()}
fauth.onAuthStateChanged(function(u){
  unsubs.forEach(function(f){f()});unsubs=[];users=[];posts=[];
  if(!u){meId=null;tab="calc";R();return}
  meId=u.uid;
  unsubs.push(db.collection("users").onSnapshot(function(s){users=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});RS()},fail));
  unsubs.push(db.collection("posts").orderBy("t").onSnapshot(function(s){posts=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});RS()},fail));
  unsubs.push(db.collection("pay").doc(u.uid).onSnapshot(function(d){if(d.exists){var x=d.data();mine={cfg:Object.assign({},DEF,x.cfg),ents:x.ents||[]}}RS()},fail));
});

/* ---------- pay ---------- */
function lim(e,c){
  var d=new Date(e.d+"T00:00");
  if(d.getDay()===5){return c.fri[Math.min(4,Math.ceil(d.getDate()/7))-1]}
  return e.t==="night"?c.night:c.day;
}
function savePay(){db.collection("pay").doc(meId).set({cfg:mine.cfg,ents:mine.ents}).catch(fail)}
function cf(k,v,i){var c=mine.cfg;if(k==="fri")c.fri[i]=Number(v)||0;else c[k]=Number(v)||0;savePay();R()}
function addEnt(){
  var e={d:$("#ed").value,t:$("#et").value,h:Number($("#eh").value)};
  if(!e.d||!(e.h>0))return toast("Pick a date and enter overtime hours.");
  mine.ents.push(e);savePay();R();
  var l=lim(e,mine.cfg);
  if(e.h>l)cuff(e.h,l);
}
function delEnt(i){mine.ents.splice(i,1);savePay();R()}
function setMonth(v){month=v||month;R()}
function cuff(h,l){
  var d=document.createElement("div");d.id="cuff";
  d.innerHTML='<div class="bx"><span class="ch">'+rnd(CAST)+'</span><span class="cf">⛓️</span><h2>Take a rest!</h2><p>You did '+h+' hours of overtime. The usual limit is '+l+' hours. Your cartoon friend says: hands off work for now.</p><button class="full" onclick="this.closest(\'#cuff\').remove()">OK, resting</button></div>';
  document.body.appendChild(d);
}
function pay(u){
  var c=mine.cfg,es=mine.ents.map(function(e,i){return{e:e,i:i}}).filter(function(x){return x.e.d.indexOf(month)===0}).sort(function(a,b){return a.e.d<b.e.d?-1:1});
  var oh=es.reduce(function(s,x){return s+x.e.h},0),nn=es.filter(function(x){return x.e.t==="night"}).length;
  var op=oh*c.rate,np=nn*c.nb,tot=c.basic+c.att+c.atti+op+np;
  var f=function(k,t){return '<label>'+t+'<input type="number" inputmode="decimal" value="'+c[k]+'" onchange="cf(\''+k+'\',this.value)"></label>'};

  '<div class="row"><span>Night bill ('+nn+' nights)</span><b>'+np.toFixed(2)+'</b></div></div>'+
  '<div class="card"><h2>Add overtime</h2><div class="g2"><label>Date<input id="ed" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label>'+
  '<label>Shift<select id="et"><option value="day">Day</option><option value="night">Night</option></select></label></div>'+

  '<button class="full" onclick="addEnt()">Add overtime</button></div>'+
  '<div class="card"><h2>Entries</h2>'+(es.length?es.map(function(x){var l=lim(x.e,c),o=x.e.h>l;return '<div class="row"><span>'+x.e.d+' · '+x.e.t+'<br><small class="'+(o?'bad':'sub')+'">'+x.e.h+' h of '+l+' h'+(o?' · over limit':'')+'</small></span><button class="ghost" onclick="delEnt('+x.i+')" aria-label="Delete entry">✕</button></div>'}).join(""):'<p class="sub">No overtime added for this month yet.</p>')+'</div>'+
  '<details class="card"><summary><b>Pay rules</b></summary><div class="g2" style="margin-top:8px">'+
  f("basic","Basic salary")+f("att","Attendance bonus")+f("atti","Attitude bonus")+f("rate","Overtime rate per hour")+f("nb","Night bill per night")+f("day","Day overtime limit (h)")+f("night","Night overtime limit (h)")+

}

function pick(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    pend=c.toDataURL("image/jpeg",.6);$("#pv").src=pend;$("#pv").style.display="block"};im.src=r.result};
  r.readAsDataURL(f);
}

  if(!pend)return toast("Choose a photo first.");
  var cap=$("#cap").value.slice(0,200);
  db.collection("posts").add({u:meId,img:pend,cap:cap,l:[],c:[],t:Date.now()}).then(function(){toast("Posted")}).catch(fail);
  pend=null;R();
}
function like(id){var p=posts.find(function(x){return x.id===id}),y=p.l.indexOf(meId)>=0;db.collection("posts").doc(id).update({l:y?FV.arrayRemove(meId):FV.arrayUnion(meId)}).catch(fail)}
function cmt(id){var el=$("#c"+id),v=el.value.trim();if(!v)return;db.collection("posts").doc(id).update({c:FV.arrayUnion({u:meId,t:v.slice(0,200),at:Date.now()})}).catch(fail);el.value=""}
function follow(id){var u=me(),y=u.follows.indexOf(id)>=0;db.collection("users").doc(meId).update({follows:y?FV.arrayRemove(id):FV.arrayUnion(id)}).catch(fail)}
function community(u){
  var others=users.filter(function(x){return x.id!==u.id});
  return '<div class="card"><h2>Post a photo</h2><input type="file" accept="image/*" onchange="pick(this)"><img id="pv" alt="Preview" style="display:none;width:100%;border-radius:10px;margin-top:8px"><label style="margin-top:8px">Caption<input id="cap" maxlength="200"></label><button class="full" onclick="post()">Post</button></div>'+
  '<div class="card"><h2>Members</h2>'+(others.length?'<div class="chips">'+others.map(function(m){var f=u.follows.indexOf(m.id)>=0;return '<div class="chip"><div class="av" style="margin:auto">'+m.av+'</div>'+esc(m.name)+'<br><button class="'+(f?'ghost':'')+'" onclick="follow(\''+m.id+'\')">'+(f?'Following':'Follow')+'</button></div>'}).join("")+'</div>':'<p class="sub">Members appear here after they register in the app.</p>')+'</div>'+
  (posts.length?posts.slice().reverse().map(function(p){var a=by(p.u),y=p.l.indexOf(u.id)>=0;
    return '<div class="card post"><div class="who"><span class="av">'+a.av+'</span>'+esc(a.name)+'</div><img src="'+p.img+'" alt="Photo by '+esc(a.name)+'">'+(p.cap?'<div>'+esc(p.cap)+'</div>':'')+
    '<button class="like '+(y?'y':'')+'" onclick="like(\''+p.id+'\')"><b>'+(y?'❤️':'🤍')+'</b> '+p.l.length+'</button>'+
    p.c.map(function(c){return '<div class="cm"><b>'+esc(by(c.u).name)+'</b> '+esc(c.t)+'</div>'}).join("")+
    '<div class="g2" style="grid-template-columns:1fr auto;margin-top:6px"><input id="c'+p.id+'" placeholder="Write a comment" maxlength="200"><button onclick="cmt(\''+p.id+'\')">Send</button></div></div>'}).join(""):'<div class="card"><p class="sub">No photos yet. Be the first to post.</p></div>');
}

/* ---------- profile & settings ---------- */
function profile(u){
  var fol=users.filter(function(x){return x.follows.indexOf(u.id)>=0}).length;
  var lk=posts.filter(function(p){return p.u===u.id}).reduce(function(s,p){return s+p.l.length},0);
  var np=posts.filter(function(p){return p.u===u.id}).length;
  return '<div class="card" style="text-align:center"><span class="big">'+u.av+'</span><h2>'+esc(u.name)+'</h2><p class="sub">'+esc(MOB())+'</p><button class="ghost" onclick="newAv()">Change cartoon</button></div>'+
  '<div class="card stats"><div><b>'+fol+'</b><span>Followers</span></div><div><b>'+lk+'</b><span>Likes</span></div><div><b>'+np+'</b><span>Posts</span></div><div><b>'+u.follows.length+'</b><span>Following</span></div></div>'+
  '<button class="ghost full" onclick="logout()">Log out</button>';
}
function newAv(){db.collection("users").doc(meId).update({av:rnd(CAST)}).catch(fail)}
function setTheme(k){
  var u=me(),t=THEMES.find(function(x){return x[0]===k}),inv=users.filter(function(x){return x.refBy===u.id}).length;
  if(inv<t[2])return toast("Invite "+(t[2]-inv)+" more friend(s) with your code to unlock.");
  db.collection("users").doc(meId).update({theme:k}).catch(fail);
}
function copyCode(){var c=me().code;try{navigator.clipboard.writeText(c)}catch(e){}toast("Your code: "+c)}
function settings(u){
  var inv=users.filter(function(x){return x.refBy===u.id}).length;
  return '<div class="card"><h2>Theme</h2>'+THEMES.map(function(t){
    var lock=inv<t[2];
    return '<button class="th '+(u.theme===t[0]?'sel':'')+'" onclick="setTheme(\''+t[0]+'\')"><span class="sw" style="background:'+({gw:"linear-gradient(135deg,#1faa59 50%,#fff 50%)",yw:"linear-gradient(135deg,#f5b700 50%,#fff 50%)",dr:"linear-gradient(135deg,#e5253d 50%,#140c0e 50%)",gb:"linear-gradient(135deg,#22e06b 50%,#0a0f0b 50%)",pp:"linear-gradient(135deg,#c14bff 50%,#ff6fb5 50%)"}[t[0]])+'"></span>'+t[1]+(lock?' 🔒 invite '+t[2]:'')+'</button>'}).join("")+'</div>'+
  '<div class="card"><h2>Invite friends</h2><p class="sub">Friends who register with your code unlock locked themes. Invited so far: <b>'+inv+'</b></p><div class="bal">'+u.code+'</div><button class="full" onclick="copyCode()">Copy my code</button></div>'+
  '<div class="card"><h2>Helpline</h2>'+HELP.map(function(h){var n=h.p.replace(/[^0-9]/g,"");return '<div class="row"><b>'+esc(h.n)+'<br><small class="sub">'+esc(h.p)+'</small></b><span><a class="btn" href="tel:'+h.p+'">Call</a> <a class="btn ghost" href="https://wa.me/'+n+'" target="_blank" rel="noopener">WhatsApp</a></span></div>'}).join("")+'</div>'+
  '<p class="sub" style="text-align:center">Built by '+BUILDER+' ❤️</p>';
}

/* ---------- shell ---------- */
function go(t){tab=t;R();window.scrollTo(0,0)}
function auth(){
  var reg=mode==="reg";
  return '<div class="top"><div class="lg"><img src="'+LOGO+'" alt="overtime coUnt logo"></div><div><h1>overtime coUnt</h1><small>by L</small></div></div><div class="card"><h2>'+(reg?"Create account":"Welcome back")+'</h2>'+
  (reg?'<label>Name<input id="n" autocomplete="name"></label>':'')+
  '<label style="margin-top:8px">Mobile number<input id="ph" type="tel" autocomplete="tel"></label><label style="margin-top:8px">Password<input id="pw" type="password" autocomplete="'+(reg?"new-password":"current-password")+'"></label>'+
  (reg?'<label style="margin-top:8px">Referral code (optional)<input id="rc"></label>':'')+
  '<p class="err" id="err"></p><button class="full" onclick="'+(reg?"reg()":"login()")+'">'+(reg?"Register":"Log in")+'</button>'+
  '<button class="ghost full" onclick="setMode(\''+(reg?"login":"reg")+'\')">'+(reg?"I already have an account":"Create a new account")+'</button></div>'+
  '<p class="sub" style="text-align:center">Built by '+BUILDER+' ❤️</p>';
}
function shell(u){
  var T=[["calc","🧮","Pay"],["com","👥","Community"],["me","🙂","Profile"],["set","⚙️","Settings"]];
  var body=tab==="calc"?pay(u):tab==="com"?community(u):tab==="me"?profile(u):settings(u);
  return '<div class="top"><div class="lg"><img src="'+LOGO+'" alt="overtime coUnt logo"></div><div><h1>overtime coUnt</h1><small>by L</small></div></div>'+body+
  '<nav class="tabs">'+T.map(function(t){return '<button class="'+(tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")+'</nav>';
}
function R(){
  var u=me();document.documentElement.dataset.t=u?u.theme:"gw";
  $("#app").innerHTML=!meId?auth():u?shell(u):'<p class="sub" style="text-align:center;margin-top:60px">Loading…</p>';
}
R();
</script>
</body>
</html>
